name: CD

on:
  push:
    branches: [develop, main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      url: https://api.${{ vars.DOMAIN }}/health

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Sentry release
        run: npx -y @railway/cli@5.75.0 variable set "SENTRY_RELEASE=$GITHUB_SHA" --service api --environment "$ENVIRONMENT" --skip-deploys
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        run: npx -y @railway/cli@5.75.0 up --service api --environment "$ENVIRONMENT" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  web:
    name: web (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      url: https://${{ matrix.subdomain }}${{ vars.DOMAIN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: landing
            project: LANDING
            subdomain: ''
          - app: dashboard
            project: DASHBOARD
            subdomain: 'app.'
          - app: storefront
            project: STOREFRONT
            subdomain: '*.'

    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars[format('VERCEL_PROJECT_ID_{0}', matrix.project)] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TARGET: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@67.0.0

      - name: Pull project settings
        run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars[format('SENTRY_DSN_{0}', matrix.project)] }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ env.ENVIRONMENT }}
          VITE_SENTRY_DSN: ${{ vars[format('SENTRY_DSN_{0}', matrix.project)] }}
          VITE_SENTRY_ENVIRONMENT: ${{ env.ENVIRONMENT }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Point the dev domain to this deployment
        if: env.ENVIRONMENT == 'dev'
        run: vercel alias set "$URL" "${{ matrix.subdomain }}${{ vars.DOMAIN }}" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
        env:
          URL: ${{ steps.deploy.outputs.url }}
