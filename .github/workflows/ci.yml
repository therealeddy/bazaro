name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so Turborepo can compare with the base branch (--affected).
          fetch-depth: 0

      - name: Setup pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Only the packages changed by this PR (and the ones that depend on them).
      - name: Typecheck, test and build
        run: pnpm turbo run typecheck test build --affected
