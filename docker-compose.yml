# Local environment. By default only the infrastructure runs (the apps run on
# the host with pnpm dev). The "app" profile also runs the api from its image:
#   docker compose --profile app up -d --build
name: bazaro

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bazaro
      POSTGRES_PASSWORD: bazaro
      POSTGRES_DB: bazaro
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bazaro -d bazaro']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://bazaro:bazaro@postgres:5432/bazaro
      REDIS_URL: redis://redis:6379
    ports:
      - 3333:3333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
